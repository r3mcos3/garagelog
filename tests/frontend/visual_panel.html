<!doctype html>
<html><head><meta charset="utf-8"><title>garagelog panel visual</title>
<style>html,body{margin:0;height:100%;background:#fafafa;font-family:Roboto,sans-serif;
--primary-color:#03a9f4;--primary-background-color:#fafafa;--secondary-background-color:#f1f1f1;--card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#727272;--divider-color:#e0e0e0;--app-header-background-color:#03a9f4;--app-header-text-color:#fff}
garagelog-panel{display:block;height:100%}</style></head>
<body>
<script src="../../custom_components/garagelog/www/garagelog-panel.js"></script>
<script src="panel_data.js"></script>
<script>
const params = new URLSearchParams(location.hash.slice(1));
try { localStorage.setItem("garagelog_tab", params.get("tab") || "overview"); } catch (e) {}
const panel = document.createElement("garagelog-panel");
document.body.appendChild(panel);
panel.narrow = params.get("narrow") === "1";
let cb;
panel.hass = { language: params.get("lang") || "nl", user: { is_admin: true }, states: { "sensor.car_odometer": {} },
  connection: {
    sendMessagePromise: async (m) => m.type === "garagelog/vehicles" ? [{ entry_id: "e1", title: "Ford Kuga (AB123C)" }, { entry_id: "e2", title: "Fiat Panda" }] : [{ value: "entity:notify.telegram", label: "Telegram · Bot" }, { value: "service:mobile_app_phone", label: "notify.mobile_app_phone" }],
    subscribeMessage: async (c) => { setTimeout(() => c(window.mockSnapshot("e1")), 0); return () => {}; },
  } };
if (params.get("modal")) setTimeout(() => panel.shadowRoot.querySelector("[data-add]").click(), 100);
</script></body></html>
